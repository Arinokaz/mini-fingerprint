[package]
name = "funnel-wasm"
version = "0.1.0"
edition = "2021"
description = "Deterministic browser telemetry conversion core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "NodeList"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.wasm-pack.profile.release]
# `strip = true` removes Rust's target_features section. Declare the features
# explicitly so Binaryen accepts the instructions emitted by current Rust.
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-bulk-memory-opt", "--enable-nontrapping-float-to-int"]
